				"swiftformatPath=/usr/local/adyen/bin/swiftformat",
				"",
				"if [ ! -f $swiftformatPath ]; then",
				"  echo \"swiftformat CLI is not installed on your machine at $swiftformatPath, please contact IS to install it for you at /usr/local/adyen/bin/ .\"",
				"  exit",
				"fi",
				"",
				"# Get list of modified Swift files (uncommitted changes)",
				"edited_files=$(git diff --name-only --diff-filter=ACM HEAD | grep '\\.swift$')",
				"",
				"if [ -z \"$edited_files\" ]; then",
				"  echo \"No edited Swift files to format.\"",
				"  exit 0",
				"fi",
				"",
				"# Format each edited file",
				"echo \"$edited_files\" | while read file; do",
				"  filepath=\"$SRCROOT/$file\"",
				"  if [ -f \"$filepath\" ]; then",
				"    echo \"Formatting $file\"",
				"    $swiftformatPath \"$filepath\"",
				"  fi",
				"done",
				"",
			);
		};
