name: 📱🔥 Firebase Distribution

on:
  workflow_dispatch:
    inputs:
      build_version_name:
        description: 'Version name shown in Firebase App Distribution (e.g. 6.0.0-beta.1)'
        required: true
        type: string
      build_number:
        description: 'Build number shown in Firebase App Distribution. Defaults to the build number in the project'
        required: false
        type: string
      release_notes:
        description: 'Text prepended to the Firebase release notes. Defaults to the branch name. The build metadata is always appended'
        required: false
        type: string
  workflow_call: # Inputs have to be repeated: GitHub does not share them between triggers
    inputs:
      build_version_name:
        description: 'Version name shown in Firebase App Distribution (e.g. 6.0.0-beta.1)'
        required: true
        type: string
      build_number:
        description: 'Build number shown in Firebase App Distribution. Defaults to the build number in the project'
        required: false
        type: string
      release_notes:
        description: 'Text prepended to the Firebase release notes. Defaults to the branch name. The build metadata is always appended'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    runs-on: macos-26-xlarge

    steps:
      - name: 🪾 Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: 📝 Create Firebase release name
        id: firebase_release_name
        env:
          BUILD_VERSION_NAME: ${{ inputs.build_version_name }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          FIREBASE_RELEASE_NAME="firebase-${BUILD_VERSION_NAME:-$BRANCH_NAME}-${SHORT_SHA}"
          echo "FIREBASE_RELEASE_NAME=$FIREBASE_RELEASE_NAME" >> $GITHUB_ENV
          echo "Release name set to $FIREBASE_RELEASE_NAME"

      - name: 🚀 Distribute to Firebase
        env:
          # Apple credentials
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

          # Xcode signing key
          XCODE_AUTHENTICATION_KEY_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ID }}
          XCODE_AUTHENTICATION_KEY_ISSUER_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ISSUER_ID }}
          XCODE_AUTHENTICATION_KEY_BASE64: ${{ secrets.XCODE_AUTHENTICATION_KEY_BASE64 }}

          # Build certificates & profiles
          BUILD_CERTIFICATE_BASE64: ${{ secrets.FIREBASE_CERTIFICATE_BASE64 }}
          DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.FIREBASE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.FIREBASE_PROVISIONING_PROFILE_BASE64 }} # Firebase uses an Enterprise Provisioning Profile
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

           # Firebase configuration
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_RELEASE_NAME: ${{ env.FIREBASE_RELEASE_NAME }}
          # Defaulted here rather than on the inputs themselves: workflow_dispatch input defaults
          # cannot contain expressions, so this is the only place both triggers behave the same.
          RELEASE_NOTES: ${{ inputs.release_notes || format('Build from the {0} branch', github.ref_name) }}

          # App configuration
          MERCHANT_CLIENT_KEY: ${{ secrets.DEMO_APP_TEST_ENV_CLIENT_KEY }}
          MERCHANT_SERVER_HOST: ${{ secrets.MERCHANT_SERVER_HOST }}
          MERCHANT_ACCOUNT: ${{ secrets.MERCHANT_ACCOUNT }}
          ADYEN_SERVER_API_KEY: ${{ secrets.DEMO_SERVER_TEST_ENV_API_KEY }}
          APPLE_TEAM_IDENTIFIER: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}

          # Version overrides (optional)
          BUILD_VERSION_NAME: ${{ inputs.build_version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          chmod +x ./Scripts/publish-demo-app-firebase.sh
          ./Scripts/publish-demo-app-firebase.sh
