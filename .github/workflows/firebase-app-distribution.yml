name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "develop"
        type: string

env:
  SCHEME: "AdyenUIHost"
  PROJECT: "AdyenUIHost.xcodeproj"
  CONFIGURATION: "Release"
  ARCHIVE_PATH: "${{ github.workspace }}/build/AdyenUIHost.xcarchive"
  EXPORT_PATH: "${{ github.workspace }}/build/ipa"
  IPA_PATH: "${{ github.workspace }}/build/ipa/AdyenUIHost.ipa"

jobs:
  distribute:
    runs-on: macos-15-xlarge

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ---- BUILD ARCHIVE ----
      - name: Archive (App Store signing)
        run: |
          mkdir -p build
          xcodebuild clean \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

      # ---- EXPORT IPA ----
      - name: Create ExportOptions.plist (app-store)
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Verify IPA exists
        run: |
          ls -la "${EXPORT_PATH}"
          test -f "${IPA_PATH}"

      # ---- FIREBASE AUTH ----
      - name: Write Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase.json

      # ---- FIREBASE DISTRIBUTION ----
      - name: Upload IPA to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ipaPath: ${{ env.IPA_PATH }}
          releaseNotes: "Build from branch '${{ github.event.inputs.branch }}' at commit ${{ github.sha }}"
          testerGroups: "ios-team"
