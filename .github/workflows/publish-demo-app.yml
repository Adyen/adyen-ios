name: 🚀 Publish Demo App

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      BUILD_CERTIFICATE_BASE64: { required: true }
      DEVELOPMENT_CERTIFICATE_BASE64: { required: true }
      P12_PASSWORD: { required: true }
      BUILD_PROVISION_PROFILE_BASE64: { required: true }
      KEYCHAIN_PASSWORD: { required: true }
      DEMO_APP_TEST_ENV_CLIENT_KEY: { required: true }
      DEMO_SERVER_TEST_ENV_API_KEY: { required: true }
      MERCHANT_ACCOUNT: { required: true }
      APPLE_DEVELOPMENT_TEAM_ID: { required: true }
      ENVIRONMENT: { required: true }
      APPLE_ID_USERNAME: { required: true }
      APPLE_APP_SPECIFIC_PASSWORD: { required: true }
      XCODE_AUTHENTICATION_KEY_ID: { required: true }
      XCODE_AUTHENTICATION_KEY_ISSUER_ID: { required: true }
      XCODE_AUTHENTICATION_KEY_BASE64: { required: true }

jobs:
  Publish:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: 🛡️ Install certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH="${{ runner.temp }}/build_certificate.p12"
        DEV_CERT_PATH="${{ runner.temp }}/dev_certificate.p12"
        PROFILE_PATH="${{ runner.temp }}/build_profile.mobileprovision"
        KEYCHAIN_PATH="${{ runner.temp }}/build.keychain-db"
        PROFILE_DIR="$HOME/Library/MobileDevice/ProvisioningProfiles"

        echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
        echo "$DEVELOPMENT_CERTIFICATE_BASE64" | base64 --decode -o "$DEV_CERT_PATH"
        echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" --force
        security import "$DEV_CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" --force
        security list-keychains -d user -s "$KEYCHAIN_PATH"

        mkdir -p "$PROFILE_DIR"
        cp "$PROFILE_PATH" "$PROFILE_DIR"

    - name: ⚙️ Configure Demo App
      env:
        CLIENT_KEY: ${{ secrets.DEMO_APP_TEST_ENV_CLIENT_KEY }}
        DEMO_SERVER_API_KEY: ${{ secrets.DEMO_SERVER_TEST_ENV_API_KEY }}
        MERCHANT_ACCOUNT: ${{ secrets.MERCHANT_ACCOUNT }}
        APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      run: |
        CONFIG_FILE="./Demo/Configuration.swift"

        sed -i '' "s/static let clientKey = .*/static let clientKey = \"$CLIENT_KEY\"/" "$CONFIG_FILE"
        sed -i '' "s/static let demoServerAPIKey = .*/static let demoServerAPIKey = \"$DEMO_SERVER_API_KEY\"/" "$CONFIG_FILE"
        sed -i '' "s/static let merchantAccount = .*/static let merchantAccount = \"$MERCHANT_ACCOUNT\"/" "$CONFIG_FILE"
        sed -i '' "s/static let appleTeamIdentifier = .*/static let appleTeamIdentifier = \"$APPLE_DEVELOPMENT_TEAM_ID\"/" "$CONFIG_FILE"
        sed -i '' "s/static let demoServerEnvironment = .*/static let demoServerEnvironment = DemoCheckoutAPIEnvironment.$ENVIRONMENT/" "$CONFIG_FILE"
        sed -i '' "s/static let classicAPIEnvironment = .*/static let classicAPIEnvironment = DemoClassicAPIEnvironment.$ENVIRONMENT/" "$CONFIG_FILE"
        sed -i '' "s/static let componentsEnvironment = .*/static let componentsEnvironment = Environment.$ENVIRONMENT/" "$CONFIG_FILE"

    - name: 🚀 Publish Demo App
      env:
        APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        XCODE_AUTHENTICATION_KEY_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ID }}
        XCODE_AUTHENTICATION_KEY_ISSUER_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ISSUER_ID }}
        XCODE_AUTHENTICATION_KEY_BASE64: ${{ secrets.XCODE_AUTHENTICATION_KEY_BASE64 }}
      run: |
        AUTH_KEY_PATH="${{ runner.temp }}/AuthKey.p8"
        echo "$XCODE_AUTHENTICATION_KEY_BASE64" | base64 --decode -o "$AUTH_KEY_PATH"

        ./Scripts/publish-demo-app.sh \
          "$APPLE_ID_USERNAME" \
          "$APPLE_APP_SPECIFIC_PASSWORD" \
          "$AUTH_KEY_PATH"