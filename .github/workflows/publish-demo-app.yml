name: 🚀 Publish Demo App

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: true
      DEVELOPMENT_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      DEMO_APP_TEST_ENV_CLIENT_KEY:
        required: true
      DEMO_SERVER_TEST_ENV_API_KEY:
        required: true
      MERCHANT_ACCOUNT:
        required: true
      APPLE_DEVELOPMENT_TEAM_ID:
        required: true
      ENVIRONMENT:
        required: true
      APPLE_ID_USERNAME:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true

jobs:
  Publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: n1hility/cancel-previous-runs@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          DEV_CERTIFICATE_PATH=$RUNNER_TEMP/dev_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$DEVELOPMENT_CERTIFICATE_BASE64" | base64 --decode -o $DEV_CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import $DEV_CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH
          security default-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          
      - name: Extract App Bundle ID from Info.plist
        id: extract_bundle_id
        run: |
          INFO_PLIST_PATH=$(find . -name Info.plist | grep "Demo/Info.plist" | head -n 1)
    
          if [ -z "$INFO_PLIST_PATH" ]; then
           echo "❌ Info.plist for Demo app not found."
          exit 1
          fi

          echo "📄 Using Info.plist at: $INFO_PLIST_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST_PATH" 2>/dev/null || true)

          if [ -z "$BUNDLE_ID" ]; then
            echo "❌ CFBundleIdentifier not found in Info.plist"
            cat "$INFO_PLIST_PATH"
            exit 1
          fi

          echo "APP_BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "✅ Extracted APP_BUNDLE_ID=$BUNDLE_ID"

      - name: Configure Demo App
        env:
          CLIENT_KEY: ${{ secrets.DEMO_APP_TEST_ENV_CLIENT_KEY }}
          DEMO_SERVER_API_KEY: ${{ secrets.DEMO_SERVER_TEST_ENV_API_KEY }}
          MERCHANT_ACCOUNT: ${{ secrets.MERCHANT_ACCOUNT }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
        run: |
          sed -i '' "s/static let clientKey.*$/static let clientKey = \"$CLIENT_KEY\"/g" ./Demo/Configuration.swift
          sed -i '' "s/static let demoServerAPIKey.*$/static let demoServerAPIKey = \"$DEMO_SERVER_API_KEY\"/g" ./Demo/Configuration.swift
          sed -i '' "s/static let merchantAccount.*=.*\".*\"/static let merchantAccount = \"$MERCHANT_ACCOUNT\"/g" ./Demo/Configuration.swift
          sed -i '' "s/static let appleTeamIdentifier.*=.*\".*\"/static let appleTeamIdentifier = \"$APPLE_DEVELOPMENT_TEAM_ID\"/g" ./Demo/Configuration.swift
          sed -i '' "s/static let demoServerEnvironment.*=.*/static let demoServerEnvironment = DemoCheckoutAPIEnvironment.$ENVIRONMENT/g" ./Demo/Configuration.swift
          sed -i '' "s/static let classicAPIEnvironment.*=.*/static let classicAPIEnvironment = DemoClassicAPIEnvironment.$ENVIRONMENT/g" ./Demo/Configuration.swift
          sed -i '' "s/static let componentsEnvironment.*=.*/static let componentsEnvironment = Environment.$ENVIRONMENT/g" ./Demo/Configuration.swift

      - name: Publish Demo App
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          export BUILD_NUMBER=$(xcrun altool --list-apps -u "$APPLE_ID_USERNAME" -p "$APPLE_APP_SPECIFIC_PASSWORD" --output-format xml | xmllint --xpath "string(//array/dict[string[text()='$APP_BUNDLE_ID']]/following-sibling::dict[1]/key[text()='version']/following-sibling::string[1])" - 2>/dev/null)
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          fi
          echo "✨ Next build number: $BUILD_NUMBER"

          ./Scripts/publish-demo-app.sh "$APPLE_ID_USERNAME" "$APPLE_APP_SPECIFIC_PASSWORD" "$BUILD_NUMBER"
