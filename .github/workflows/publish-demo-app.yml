name: 🚀 Publish Demo App
on:
  workflow_dispatch:
  workflow_call:
    secrets: # When triggered via another workflow, secrets are not automatically forwarded
      BUILD_CERTIFICATE_BASE64:
        required: true
      DEVELOPMENT_CERTIFICATE_BASE64: # If used for local development signing, keep it. Otherwise, might be removable for App Store builds.
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      DEMO_APP_TEST_ENV_CLIENT_KEY:
        required: true
      DEMO_SERVER_TEST_ENV_API_KEY:
        required: true
      MERCHANT_ACCOUNT:
        required: true
      APPLE_DEVELOPMENT_TEAM_ID:
        required: true
      ENVIRONMENT:
        required: true
      APPLE_ID_USERNAME:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      XCODE_AUTHENTICATION_KEY_ID:
        required: true
      XCODE_AUTHENTICATION_KEY_ISSUER_ID:
        required: true
      XCODE_AUTHENTICATION_KEY_BASE64:
        required: true
  
jobs:

  Publish:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: Install the Apple certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |

        # create variables
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        DEV_CERTIFICATE_PATH="$RUNNER_TEMP/dev_certificate.p12"
        PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

        # import certificate and provisioning profile from secrets
        echo "Attempting to decode BUILD_CERTIFICATE_BASE64..."
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
        if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "Error: Build certificate file is empty or missing after decoding."
            ls -l "$RUNNER_TEMP" # List contents to verify
            exit 1
        fi
        echo "Build certificate decoded to $CERTIFICATE_PATH (size: $(stat -f%z "$CERTIFICATE_PATH") bytes)"

        echo "Attempting to decode DEVELOPMENT_CERTIFICATE_BASE64..."
        echo -n "$DEVELOPMENT_CERTIFICATE_BASE64" | base64 --decode -o "$DEV_CERTIFICATE_PATH"
        if [ ! -s "$DEV_CERTIFICATE_PATH" ]; then
            echo "Warning: Development certificate file is empty or missing after decoding."
            # Don't exit here if it's optional
        fi
        echo "Development certificate decoded to $DEV_CERTIFICATE_PATH (size: $(stat -f%z "$DEV_CERTIFICATE_PATH") bytes)"

        echo "Attempting to decode BUILD_PROVISION_PROFILE_BASE64..."
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
        if [ ! -s "$PP_PATH" ]; then
            echo "Error: Provisioning profile file is empty or missing after decoding. Base64 secret might be empty/invalid."
            ls -l "$RUNNER_TEMP"
            exit 1
        fi
        echo "Provisioning profile decoded to $PP_PATH (size: $(stat -f%z "$PP_PATH") bytes)"
        # --- NEW DEBUGGING STEP ---
        echo "First 100 bytes of $PP_PATH (hex dump):"
        head -c 100 "$PP_PATH" | xxd -p | tr -d '\n' | sed 's/../& /g' # Show hex dump
        echo "" # Newline for readability
        echo "Checking file type of $PP_PATH:"
        file "$PP_PATH" # Show file type
        # --- END NEW DEBUGGING STEP ---


        # create temporary keychain
        echo "Creating temporary keychain..."
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "Keychain created and unlocked."

        # import release certificate to keychain
        echo "Importing certificates to keychain..."
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security import "$DEV_CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        echo "Certificates imported."
        security find-identity -p codesigning "$KEYCHAIN_PATH" # List identities for debugging

        # apply provisioning profile
        echo "Copying provisioning profile..."
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "Provisioning profile copied."

        # --- NEW: Extract names and make them available to subsequent steps ---
        # Extract Provisioning Profile Name
        echo "Attempting to extract Provisioning Profile Name..."
        # Redirect stderr to /dev/null for security cms to silence "Cannot parse..." output
        PROVISIONING_PROFILE_NAME=$(security cms -D -i "$PP_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
        if [ -z "$PROVISIONING_PROFILE_NAME" ]; then
            echo "Error: Failed to extract Provisioning Profile Name. Content of profile may be invalid or not a valid CMS file."
            # cat "$PP_PATH" # Temporarily uncomment this with EXTREME CAUTION to see raw content, but it will print secret data!
            exit 1
        fi
        echo "Extracted Provisioning Profile Name: $PROVISIONING_PROFILE_NAME"
        echo "PROVISIONING_PROFILE_NAME=$PROVISIONING_PROFILE_NAME" >> "$GITHUB_ENV"

        # Extract Code Sign Identity Name from the certificate
        echo "Attempting to extract Code Sign Identity Name..."
        CODE_SIGN_IDENTITY_NAME=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')
        if [ -z "$CODE_SIGN_IDENTITY_NAME" ]; then
            # Fallback if "Apple Distribution" not found, try "iPhone Distribution" (older or enterprise)
            CODE_SIGN_IDENTITY_NAME=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | grep "iPhone Distribution" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')
        fi
        if [ -z "$CODE_SIGN_IDENTITY_NAME" ]; then
            echo "Error: Failed to extract Code Sign Identity Name from keychain. No matching identity found."
            security find-identity -p codesigning -v "$KEYCHAIN_PATH" # Verbose output
            exit 1
        fi
        echo "Extracted Code Sign Identity Name: $CODE_SIGN_IDENTITY_NAME"
        echo "CODE_SIGN_IDENTITY_NAME=$CODE_SIGN_IDENTITY_NAME" >> "$GITHUB_ENV"
        # --- END NEW ---

    - name: Configure Demo App
      env:
        CLIENT_KEY: ${{ secrets.DEMO_APP_TEST_ENV_CLIENT_KEY }}
        DEMO_SERVER_API_KEY: ${{ secrets.DEMO_SERVER_TEST_ENV_API_KEY }}
        MERCHANT_ACCOUNT: ${{ secrets.MERCHANT_ACCOUNT }}
        APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      run: |
        # client Key
        # Log first 3 and last 3 characters of Team ID
        TEAM_ID="${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}"
        echo "Development Team ID (partial): ${TEAM_ID:0:3}...${TEAM_ID: -3}"
        sed -i '' "s/static let clientKey.*$/static let clientKey = \"$CLIENT_KEY\"/g" ./Demo/Configuration.swift

        # demo server API key
        sed -i '' "s/static let demoServerAPIKey.*$/static let demoServerAPIKey = \"$DEMO_SERVER_API_KEY\"/g" ./Demo/Configuration.swift

        # merchant account
        sed -i '' "s/static let merchantAccount.*=.*\".*\"/static let merchantAccount = \"$MERCHANT_ACCOUNT\"/g" ./Demo/Configuration.swift

        # apple team identifier
        sed -i '' "s/static let appleTeamIdentifier.*=.*\".*\"/static let appleTeamIdentifier = \"$APPLE_DEVELOPMENT_TEAM_ID\"/g" ./Demo/Configuration.swift

        # demoServerEnvironment
        sed -i '' "s/static let demoServerEnvironment.*=.*/static let demoServerEnvironment = DemoCheckoutAPIEnvironment.$ENVIRONMENT/g" ./Demo/Configuration.swift

        # classicAPIEnvironment
        sed -i '' "s/static let classicAPIEnvironment.*=.*/static let classicAPIEnvironment = DemoClassicAPIEnvironment.$ENVIRONMENT/g" ./Demo/Configuration.swift

        # componentsEnvironment
        sed -i '' "s/static let componentsEnvironment.*=.*/static let componentsEnvironment = Environment.$ENVIRONMENT/g" ./Demo/Configuration.swift

    - name: Clean Xcode Derived Data and Caches
      run: |
        echo "Cleaning Xcode build folder..."
        # Adjust workspace and scheme names to your actual project if different
        xcodebuild clean -workspace "Adyen.xcworkspace" -scheme "AdyenUIHost" || true 
        
        echo "Deleting Derived Data..."
        rm -rf "$HOME/Library/Developer/Xcode/DerivedData/*"
        
        echo "Cleaning Xcode caches..."
        rm -rf "$HOME/Library/Caches/com.apple.dt.Xcode/*"
        
        echo "Cleaning CocoaPods cache (if applicable)..."
        # Uncomment and adjust if you use CocoaPods
        # rm -rf "$HOME/.cocoapods/repos"
        # rm -rf Pods
        # rm -f Podfile.lock
        # pod cache clean --all
        # pod deintegrate
        
        echo "Cleaning Swift Package Manager caches (if applicable)..."
        swift package clean || true # This cleans SPM build artifacts within the project
        
        echo "Done cleaning."

    - name: Publish Demo App
      env:
        APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        XCODE_AUTHENTICATION_KEY_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ID }}
        XCODE_AUTHENTICATION_KEY_ISSUER_ID: ${{ secrets.XCODE_AUTHENTICATION_KEY_ISSUER_ID }}
        XCODE_AUTHENTICATION_KEY_BASE64: ${{ secrets.XCODE_AUTHENTICATION_KEY_BASE64 }}
        # Pass the extracted names to the script
        APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        PROVISIONING_PROFILE_NAME: ${{ env.PROVISIONING_PROFILE_NAME }} # Use env context
        CODE_SIGN_IDENTITY_NAME: ${{ env.CODE_SIGN_IDENTITY_NAME }}     # Use env context
      run: |
        XCODE_AUTHENTICATION_KEY_PATH="$RUNNER_TEMP/authentication_key_path.p8"
        rm -f "$XCODE_AUTHENTICATION_KEY_PATH"
        echo -n "$XCODE_AUTHENTICATION_KEY_BASE64" | base64 --decode -o "$XCODE_AUTHENTICATION_KEY_PATH"

        # Pass all necessary arguments to the shell script
        ./Scripts/publish-demo-app.sh \
          "$APPLE_ID_USERNAME" \
          "$APPLE_APP_SPECIFIC_PASSWORD" \
          "$XCODE_AUTHENTICATION_KEY_PATH" \
          "$APPLE_DEVELOPMENT_TEAM_ID" \
          "$PROVISIONING_PROFILE_NAME" \
          "$CODE_SIGN_IDENTITY_NAME" \
          "${{ secrets.XCODE_AUTHENTICATION_KEY_ID }}" \
          "${{ secrets.XCODE_AUTHENTICATION_KEY_ISSUER_ID }}"