name: Scan PR

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - develop


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sonar

jobs:

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            testPlan: UnitTests
            resultPath: Test-Unit-Result.xcresult
          - suite: integration
            testPlan: IntegrationTests
            resultPath: Test-Integration-Result.xcresult
    env:
      destination: "platform=iOS Simulator,name=iPhone Air,OS=26.2"
      project: "Adyen.xcodeproj"
      params: "-derivedDataPath ./DerivedData -skipPackagePluginValidation"
    runs-on: macos-26-xlarge

    steps:
    - uses: actions/checkout@v7

    - name: Validate Versions
      run: |
        Scripts/validate-3ds2-SDK-version.sh
        Scripts/validate-Adyen-SDK-version.sh

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: 🧪 ${{ matrix.suite }} Tests
      run: |
        set -o pipefail
        set +e

        xcodebuild test \
          -project "${{env.project}}" \
          -scheme "${scheme}" \
          -testPlan "${{matrix.testPlan}}" \
          -enableCodeCoverage YES \
          -resultBundlePath "${{matrix.resultPath}}" \
          -test-iterations 3 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled YES \
          ${params} \
          -destination "${{env.destination}}" \
          2>&1 | tee "xcodebuild-${{matrix.suite}}-tests.log" | xcbeautify --quieter --is-ci

        statuses=("${PIPESTATUS[@]}")
        set -e

        printf 'Exit codes: xcodebuild=%s tee=%s xcbeautify=%s\n' \
          "${statuses[0]}" "${statuses[1]}" "${statuses[2]}"

        exit "${statuses[0]}"
      env:
        params: '${{env.params}}'
        scheme: 'AdyenUIHost'

    - name: Upload test diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          xcodebuild-${{matrix.suite}}-tests.log
          ~/Library/Logs/DiagnosticReports/
        if-no-files-found: warn
        retention-days: 7

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.suite }}-${{ github.run_id }}
        path: ${{ matrix.resultPath }}
        if-no-files-found: error
        retention-days: 7
        overwrite: true

  quality:
    needs: test
    env:
      sonarToken: ${{ secrets.SONAR_TOKEN }}
      project: "Adyen.xcodeproj"
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: 🛠️ Install Tools
      run: |
        brew update
        brew install sonar-scanner

    - name: Download unit test results
      uses: actions/download-artifact@v7
      with:
        name: test-results-unit-${{ github.run_id }}
        path: Test-Unit-Result.xcresult

    - name: Download integration test results
      uses: actions/download-artifact@v7
      with:
        name: test-results-integration-${{ github.run_id }}
        path: Test-Integration-Result.xcresult

    - name: Verify test results layout
      run: |
        test -f Test-Unit-Result.xcresult/Info.plist
        test -f Test-Integration-Result.xcresult/Info.plist

    - name: 🧼 SwiftLint
      run: |
        brew install swiftlint
        fastlane run swiftlint output_file:"reports/swiftlint.json" reporter:"json" ignore_exit_status:"true"

    # Skipped in the merge queue: analysing the temporary gh-readonly-queue/** ref
    # would register a throwaway branch in Sonar for every queued pull request.
    - name: 📡 Run Sonar
      if: ${{ env.sonarToken != 0 && github.event_name != 'merge_group' }}
      run: |
        # TODO: Temporarily commented - re-enable with snapshot tests
        # bash Scripts/xccov-to-sonarqube-generic.sh Test-Snapshots-Result.xcresult/ > sonarqube-coverage-snapshots.xml
        # sed "s#$PWD/##g" sonarqube-coverage-snapshots.xml > sonarqube_updated_snapshots.xml
        bash Scripts/xccov-to-sonarqube-generic.sh Test-Unit-Result.xcresult/ > sonarqube-coverage-unit.xml
        sed "s#$PWD/##g" sonarqube-coverage-unit.xml > sonarqube_updated_unit.xml
        bash Scripts/xccov-to-sonarqube-generic.sh Test-Integration-Result.xcresult/ > sonarqube-coverage-integration.xml
        sed "s#$PWD/##g" sonarqube-coverage-integration.xml > sonarqube_updated_integration.xml
        git fetch --unshallow --no-tags
        sonar-scanner -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.coverageReportPaths=sonarqube_updated_unit.xml,sonarqube_updated_integration.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: ${{ always() }}
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
    - name: Require test and quality jobs to succeed
      run: |
        echo "test=${{ needs.test.result }} quality=${{ needs.quality.result }}"
        [[ "${{ needs.test.result }}" == "success" && "${{ needs.quality.result }}" == "success" ]]

  compatibility:
    needs: [test, quality]
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || startsWith(github.base_ref, 'release/')) }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:

        # Xcode 26.2 - iOS 18
        - version: '18.6'
          runtime: 'iOS-18-6'
          device: 'iPhone 16 Pro'
          displayname: 'iPhone-16-Pro'
          os: 'macos-15'
          xcode_version: '26.2'
          needs_custom_sim: false

        # Xcode 16.4 - iOS 17
        - version: '17.5'
          runtime: 'iOS-17-5'
          device: 'iPhone 15 Pro'
          displayname: 'iPhone-15-Pro'
          os: 'macos-15'
          xcode_version: '16.4'
          needs_custom_sim: true

        # Xcode 16.4 - iOS 16
        - version: '16.4'
          runtime: 'iOS-16-4'
          device: 'iPhone 14 Pro'
          displayname: 'iPhone-14-Pro'
          os: 'macos-15'
          xcode_version: '16.4'
          needs_custom_sim: true

    steps:
    - uses: actions/checkout@v7

    - name: Prepare custom devices
      run: |
        sudo mkdir -p /Library/Developer/CoreSimulator/Profiles/Runtimes

    - name: Select Xcode ${{ matrix.xcode_version }}
      if: matrix.xcode_version != ''
      run: |
        sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
        xcodebuild -version

    - name: Download and install simulator runtime
      if: matrix.needs_custom_sim == true
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 30
        command: |
          echo "Downloading iOS ${{ matrix.version }} runtime via xcodebuild..."
          # Wake CoreSimulatorService first; otherwise -downloadPlatform
          # intermittently fails with "Unable to connect to simulator" (exit 70)
          # see - https://github.com/actions/runner-images/issues/13459
          sudo xcrun simctl list > /dev/null
          sudo xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.version }}

          # Verify the runtime actually installed, else fail so retry kicks in
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -q "iOS ${{ matrix.version }}"

    - name: Create simulator ${{ matrix.version }}
      run: |
        xcrun simctl list devices ${version}
        xcrun simctl create ${displayname} "${device}" "com.apple.CoreSimulator.SimRuntime.${runtime}"
      env:
        version: ${{ matrix.version }}
        displayname: ${{ matrix.displayname }}
        device: ${{ matrix.device }}
        runtime: ${{ matrix.runtime }}

    - name: Build and test
      env:
        DEST: "platform=iOS Simulator,OS=${{ matrix.version }},name=${{ matrix.displayname }}"
      run: |
        echo "Destination: $DEST"
        set +e
        xcodebuild build test \
          -project "Adyen.xcodeproj" \
          -scheme "IntegrationUIKitTests" \
          -destination "$DEST" \
          -skipPackagePluginValidation \
          -test-iterations 3 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled YES \
          SWIFT_VERSION=5 2>&1 | tee compatibility-xcodebuild.log | xcbeautify --quieter --is-ci --disable-logging
        status=${PIPESTATUS[0]}
        exit "$status"

    - name: Upload raw compatibility test log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: compatibility-xcodebuild-${{ matrix.displayname }}-ios-${{ matrix.version }}
        path: compatibility-xcodebuild.log
        if-no-files-found: error

  snapshots:
    if: false  # Temporarily disabled until we stabilize the UI
    env:
      destination: "platform=iOS Simulator,name=iPhone Air,OS=26.2"
      destination_iPad: "platform=iOS Simulator,name=iPad Air,OS=26.2"
      project: "Adyen.xcodeproj"
      params: "-derivedDataPath ./DerivedData -skipPackagePluginValidation"
    runs-on: macos-26-xlarge

    steps:
    - uses: actions/checkout@v7

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: 🌇 Snapshot Tests iPhone
      if: false
      run: |
        xcodebuild test \
          -project "${{env.project}}" \
          -scheme "${scheme}" \
          -testPlan "${testPlan}" \
          -enableCodeCoverage YES \
          -resultBundlePath "${resultPath}" \
          -test-iterations 3 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled YES \
          ${params} \
          -destination "${{env.destination}}" | xcbeautify --quieter --is-ci && exit ${PIPESTATUS[0]}
      env:
        params: '${{env.params}}'
        scheme: 'SnapshotTests'
        testPlan: 'SnapshotTests'
        resultPath: 'Test-Snapshots-Result.xcresult'

    - name: 🌇 Snapshot Tests iPad
      if: false
      run: |
        xcodebuild test \
          -project "${{env.project}}" \
          -scheme "${scheme}" \
          -testPlan "${testPlan}" \
          -enableCodeCoverage YES \
          -resultBundlePath "${resultPath}" \
          -test-iterations 3 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled YES \
          ${params} \
          -destination "${{env.destination_iPad}}" | xcbeautify --quieter --is-ci && exit ${PIPESTATUS[0]}
      env:
        params: '${{env.params}}'
        scheme: 'SnapshotTests'
        testPlan: 'SnapshotTests'
        resultPath: 'Test-Snapshots-Result-iPad.xcresult'
