name: Format project
on:
    workflow_dispatch:
    workflow_call:
    
jobs:

  Update:
    runs-on: macos-14
    steps:
    - name: 🍱 Compute prerequisites
      run: |
        echo "BASE_REPO=${{ github.repository }}" >> $GITHUB_ENV
        echo "BASE_REF=${{ env.target }}" >> $GITHUB_ENV
        echo "HEAD_REF=${{ env.base }}" >> $GITHUB_ENV
      shell: bash
      env:
        target: '${{ github.event.pull_request.base.ref }}'
        base: '${{ github.head_ref }}'
    
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.BASE_REPO }}
        ref: ${{ env.HEAD_REF }}
        
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Format project
      run: |
        brew install swiftformat
        cat .swiftformat
        swiftformat . --verbose
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        delete-branch: true
        branch: "format-project-github-action-${{ env.HEAD_REF }}"
        base: ${{ env.HEAD_REF }}
        commit-message: "chore: formatting project"
        title: "[${{ env.HEAD_REF }}] Format project"
        body: "Formatting project for `${{ env.HEAD_REF }}`"
        token: ${{ secrets.GITHUB_TOKEN }}
