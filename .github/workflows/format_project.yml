name: Format project
on:
    workflow_dispatch:
    workflow_call:
    
jobs:

  Update:
    runs-on: macos-14
    steps:
    - name: 🍱 Compute prerequisites
      run: |
        echo "BASE_REPO=${{ github.repository }}" >> $GITHUB_ENV
        echo "BASE_REF=${{ env.target }}" >> $GITHUB_ENV
      shell: bash
    
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.BASE_REPO }}
        ref: ${{ env.BASE_REF }}
        
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Format project
      run: |
        brew install swiftformat
        swiftformat .
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        delete-branch: true
        branch: format-project-github-action
        commit-message: "chore: format project"
        title: Format project
        body: Format project.
        token: ${{ secrets.GITHUB_TOKEN }}
