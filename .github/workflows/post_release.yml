# This workflow will publish the Docs and the Demo App

name: 🗣️ Post Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write

jobs:

  deploy-docs:
    name: 📝 Deploy Docs
    uses: ./.github/workflows/deploy-docs.yml

  publish-app:
    name: 🚀 Publish Demo App
    uses: ./.github/workflows/publish-demo-app.yml
    secrets: inherit
