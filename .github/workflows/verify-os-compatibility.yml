name: Compatibility Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'release/**'
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
    
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
        
        # Xcode 26.2 - iOS 18
        - version: '18.6'
          runtime: 'iOS-18-6'
          device: 'iPhone 16 Pro'
          displayname: 'iPhone-16-Pro'
          os: 'macos-15'
          xcode_version: '26.2'
          needs_custom_sim: false
          
        # Xcode 16.4 - iOS 17
        - version: '17.5'
          runtime: 'iOS-17-5'
          device: 'iPhone 15 Pro'
          displayname: 'iPhone-15-Pro'
          os: 'macos-15'
          xcode_version: '16.4' 
          needs_custom_sim: true
                            
        # Xcode 16.4 - iOS 16
        - version: '16.4'
          runtime: 'iOS-16-4'
          device: 'iPhone 14 Pro'
          displayname: 'iPhone-14-Pro'
          os: 'macos-15'
          xcode_version: '16.4'
          needs_custom_sim: true

    steps:
    - uses: actions/checkout@v7

    - name: Prepare custom devices
      run: |
        sudo mkdir -p /Library/Developer/CoreSimulator/Profiles/Runtimes

    - name: Select Xcode ${{ matrix.xcode_version }}
      if: matrix.xcode_version != ''
      run: |
        sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
        xcodebuild -version
        
    - name: Download and install simulator runtime
      if: matrix.needs_custom_sim == true
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 30
        command: |
          echo "Downloading iOS ${{ matrix.version }} runtime via xcodebuild..."
          # Wake CoreSimulatorService first; otherwise -downloadPlatform
          # intermittently fails with "Unable to connect to simulator" (exit 70)
          # see - https://github.com/actions/runner-images/issues/13459
          sudo xcrun simctl list > /dev/null
          sudo xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.version }}

          # Verify the runtime actually installed, else fail so retry kicks in
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -q "iOS ${{ matrix.version }}"

    - name: Create simulator ${{ matrix.version }}
      run: |
        xcrun simctl list devices ${version}
        xcrun simctl create ${displayname} "${device}" "com.apple.CoreSimulator.SimRuntime.${runtime}"
      env:
        version: ${{ matrix.version }}
        displayname: ${{ matrix.displayname }}
        device: ${{ matrix.device }}
        runtime: ${{ matrix.runtime }}

    - name: Build and test
      env:
        DEST: "platform=iOS Simulator,OS=${{ matrix.version }},name=${{ matrix.displayname }}"
      run: |
        echo "Destination: $DEST"
        xcodebuild build test \
          -project "Adyen.xcodeproj" \
          -scheme "IntegrationUIKitTests" \
          -destination "$DEST" \
          -skipPackagePluginValidation \
          -test-iterations 3 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled YES \
          SWIFT_VERSION=5


