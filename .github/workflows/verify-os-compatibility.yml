name: Compatibility Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'release/**'
      - 'develop'
    
permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
        
        # Xcode 26 (iOS 18.6 bundled, no custom sim needed)
        - version: '18.6'
          runtime: 'iOS-18-6'
          device: 'iPhone 16 Pro'
          displayname: 'iPhone 16 Pro'   # fixed name
          os: 'macos-15-large'
          xcode_version: '26.0'
          needs_custom_sim: false
          
        # Xcode 16.4 - iOS 17 (use 17.4 instead of 17.5)
        - version: '17.4'
          runtime: 'iOS-17-4'
          device: 'iPhone 15 Pro'
          displayname: 'iPhone 15 Pro'
          os: 'macos-15'
          xcode_version: '16.4' 
          needs_custom_sim: true
                            
        # Xcode 16.4 - iOS 16
        - version: '16.4'
          runtime: 'iOS-16-4'
          device: 'iPhone 14 Pro'
          displayname: 'iPhone 14 Pro'
          os: 'macos-15'
          xcode_version: '16.4'
          needs_custom_sim: true

    steps:
    - uses: actions/checkout@v4
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: List available Xcode versions
      run: |
        echo "=== Installed Xcodes in /Applications ==="
        ls -1 /Applications | grep Xcode || true
        echo
        echo "=== Xcode app bundle versions ==="
        mdls -name kMDItemVersion /Applications/Xcode*.app | grep kMDItemVersion || true

    - name: Inspect SDKs and runtimes
      run: |
        for x in /Applications/Xcode*.app; do
          echo "---- $x ----"
          sudo xcode-select -s "$x"
          xcodebuild -version
          echo "Available iOS runtimes:"
          xcrun simctl list runtimes | grep iOS || true
          echo
        done

    - name: Select Xcode ${{ matrix.xcode_version }}
      if: matrix.xcode_version != ''
      run: |
        sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
        xcodebuild -version
        xcrun simctl list runtimes
        
    - name: Download and install simulator runtime
      if: matrix.needs_custom_sim == true
      run: |
        echo "Downloading iOS ${{ matrix.version }} runtime using xcodes..."
        sudo xcodes runtimes install "iOS ${{ matrix.version }}"
        
        # Verify simulator is available
        xcrun simctl list runtimes

    - name: Create simulator ${{ matrix.version }}
      run: |
        xcrun simctl list runtimes
        xcrun simctl create ${displayname} "${device}" "com.apple.CoreSimulator.SimRuntime.${runtime}"
      env:
        displayname: ${{ matrix.displayname }}
        device: ${{ matrix.device }}
        runtime: ${{ matrix.runtime }}

    - name: Build and test
      run: |
        xcodebuild -version
        xcodebuild build test -project ${project} -scheme "${scheme}" ${params} -destination "OS=${{ matrix.version }},name=${{ matrix.displayname }}"
      env:
        project: 'Adyen.xcodeproj'
        params: "-skipPackagePluginValidation"
        scheme: 'IntegrationUIKitTests'
