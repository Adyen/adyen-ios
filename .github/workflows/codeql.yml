name: "CodeQL Analysis"

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  analyze:
    name: Analyze
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift, actions]
        build-mode: [manual, none]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Download baseline CodeQL database
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v3
        with:
          name: codeql-database-${{ matrix.language }}
          path: codeql-database

      - name: Build project
        if: matrix.language == 'swift' && matrix.build-mode == 'manual'
        run: |
          xcodebuild -project Adyen.xcodeproj \
            -scheme Adyen \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            SKIP_INSTALL=NO build | xcpretty --utf --color

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          baseline-database: codeql-database/${{ matrix.language }}

      - name: Upload CodeQL Database (baseline)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v3
        with:
          name: codeql-database-${{ matrix.language }}
          path: codeql-database
