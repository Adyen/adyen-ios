name: Test Cocoapods Integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
    - develop

jobs:

  pods:
    runs-on: macos-15-xlarge
    steps:
    - uses: actions/checkout@v4
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: Lint Cocoapods
      run: |
        # using mint to lock older version until Xcode16 bug is fixed
        # https://github.com/yonaskolb/XcodeGen/pull/1563

        brew update
        brew install mint
        mint install yonaskolb/xcodegen@2.43.0
        export PATH="$PATH:/Users/runner/.mint/bin"
        
        gem install cocoapods -v 1.10.2
        pod repo update
        
        pod lib lint Adyen.podspec --allow-warnings --verbose
        # pod lib lint AdyenCardScanner.podspec --allow-warnings --verbose

        Scripts/test-CocoaPods-integration.sh -w
        Scripts/test-CocoaPods-integration.sh
