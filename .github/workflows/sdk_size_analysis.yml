# .github/workflows/sdk-size-analysis.yml
name: SDK Size Analysis

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze-sdk-size:
    runs-on: macos-15-xlarge

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Run SDK Size Analysis Script
        run: |
          ./Scripts/sdk_size_analysis.sh

      - name: Sanitize branch name
        id: sanitize
        run: |
          sanitized_branch=${GITHUB_HEAD_REF//\//-}
          echo "sanitized_branch=$sanitized_branch" >> $GITHUB_OUTPUT

      - name: Upload SDK size JSON
        uses: actions/upload-artifact@v4
        with:
          name: sdk-sizes-${{ steps.sanitize.outputs.sanitized_branch }}
          path: sdk_size_output/sdk_sizes.json
          
  comment-sdk-size:
    runs-on: ubuntu-latest
    needs: analyze-sdk-size
    if: success()

    steps:
      - name: Download SDK size JSON
        uses: actions/download-artifact@v4
        with:
          name: sdk-sizes-${{ steps.sanitize.outputs.sanitized_branch }}

      - name: Read and format size summary
        id: format
        run: |
          echo '```' > comment.txt
          jq -r 'to_entries | sort_by(.value) | reverse | .[] | "\(.key): \(.value) KB"' sdk_sizes.json >> comment.txt
          echo '```' >> comment.txt
          cat comment.txt

      - name: Post SDK size comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sdk-size
          path: comment.txt
